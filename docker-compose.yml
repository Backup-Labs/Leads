services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-leads}
      DB_USERNAME: ${DB_USERNAME:-leads_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - leads-network

  nginx:
    image: nginx:alpine
    container_name: leads_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - leads-network

  postgres:
    image: postgres:17-alpine
    container_name: leads_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-leads}
      POSTGRES_USER: ${DB_USERNAME:-leads_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-leads_user} -d ${DB_DATABASE:-leads}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leads-network

  redis:
    image: redis:7-alpine
    container_name: leads_redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - leads-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-leads}
      DB_USERNAME: ${DB_USERNAME:-leads_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - redis
    networks:
      - leads-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-leads}
      DB_USERNAME: ${DB_USERNAME:-leads_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - redis
    networks:
      - leads-network

volumes:
  postgres_data:
  redis_data:

networks:
  leads-network:
    driver: bridge

